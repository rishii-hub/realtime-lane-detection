name: python-package

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: build & import check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Build the package
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Install from wheel
        run: pip install dist/*.whl

      - name: Smoke test the CLI
        run: |
          lane-detect --version
          python -c "import app; print('imported app', app.__version__)"
