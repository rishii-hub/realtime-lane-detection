[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "realtime-lane-detection"
version = "1.0.0"
description = "Real-time lane detection with classical computer vision (Canny + Hough) and a modern dashboard."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Rishi" }]
keywords = [
    "computer-vision",
    "lane-detection",
    "opencv",
    "adas",
    "self-driving",
    "hough-transform",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Image Recognition",
]
dependencies = [
    "numpy>=1.24",
    "opencv-python>=4.8",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.4",
    "black>=24.0",
    "mypy>=1.8",
    "pre-commit>=3.6",
]

[project.scripts]
lane-detect = "app.__main__:main"

[project.urls]
Homepage = "https://github.com/rishii-hub/realtime-lane-detection"
Repository = "https://github.com/rishii-hub/realtime-lane-detection"
Documentation = "https://github.com/rishii-hub/realtime-lane-detection/tree/main/docs"
Issues = "https://github.com/rishii-hub/realtime-lane-detection/issues"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "C4", "SIM"]
ignore = ["B008"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.mypy]
python_version = "3.10"
warn_unused_ignores = true
warn_redundant_casts = true
ignore_missing_imports = true

# Third-party libraries without first-party stubs (or whose bundled stubs target
# a newer Python than we type-check against) are treated as opaque.
[[tool.mypy.overrides]]
module = ["numpy.*", "cv2.*", "yaml.*"]
follow_imports = "skip"
follow_imports_for_stubs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"

[tool.coverage.run]
source = ["app"]
omit = ["app/__main__.py", "app/runner.py"]
