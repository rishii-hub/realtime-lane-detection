[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lanevision"
version = "2.0.0"
description = "Real-time lane detection with curve-following classical computer vision and a React dashboard."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Rishi" }]
keywords = [
    "computer-vision",
    "lane-detection",
    "opencv",
    "adas",
    "self-driving",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Image Recognition",
]
dependencies = [
    "opencv-python>=4.8",
    "numpy>=1.24",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.4", "black>=24.0"]

[project.scripts]
lanevision = "cli:main"

[project.urls]
Repository = "https://github.com/rishii-hub/realtime-lane-detection"

[tool.setuptools]
packages = ["lane_detector"]
py-modules = ["cli", "app"]

[tool.black]
line-length = 100
target-version = ["py39"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
# B008: FastAPI relies on function calls (File(...), Depends(...)) in defaults
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
