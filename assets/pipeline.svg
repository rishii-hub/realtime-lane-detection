<svg width="1000" height="260" viewBox="0 0 1000 260" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Detection pipeline diagram" font-family="'Segoe UI',Inter,Arial,sans-serif">
  <defs>
    <marker id="parr" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#22C55E"/>
    </marker>
    <linearGradient id="stage" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#161B22"/>
      <stop offset="1" stop-color="#10151D"/>
    </linearGradient>
  </defs>
  <rect width="1000" height="260" fill="#0D1117"/>
  <text x="40" y="46" fill="#E6EDF3" font-size="22" font-weight="800">Detection Pipeline</text>
  <text x="40" y="70" fill="#8B949E" font-size="13">Each stage is a small, unit-tested method</text>

  <g>
    <!-- 7 stages -->
    <!-- stage template -->
    <!-- 1 -->
    <rect x="40"  y="100" width="118" height="86" rx="12" fill="url(#stage)" stroke="#30363D"/>
    <text x="99" y="132" fill="#22C55E" font-size="12" font-weight="700" text-anchor="middle">1 · CAPTURE</text>
    <text x="99" y="154" fill="#E6EDF3" font-size="13" font-weight="600" text-anchor="middle">Frame</text>
    <text x="99" y="172" fill="#8B949E" font-size="11" text-anchor="middle">BGR input</text>
    <!-- 2 -->
    <rect x="176" y="100" width="118" height="86" rx="12" fill="url(#stage)" stroke="#30363D"/>
    <text x="235" y="132" fill="#22C55E" font-size="12" font-weight="700" text-anchor="middle">2 · PREP</text>
    <text x="235" y="154" fill="#E6EDF3" font-size="13" font-weight="600" text-anchor="middle">Downscale</text>
    <text x="235" y="172" fill="#8B949E" font-size="11" text-anchor="middle">≤ 800px</text>
    <!-- 3 -->
    <rect x="312" y="100" width="118" height="86" rx="12" fill="url(#stage)" stroke="#30363D"/>
    <text x="371" y="132" fill="#22C55E" font-size="12" font-weight="700" text-anchor="middle">3 · EDGES</text>
    <text x="371" y="154" fill="#E6EDF3" font-size="13" font-weight="600" text-anchor="middle">Canny</text>
    <text x="371" y="172" fill="#8B949E" font-size="11" text-anchor="middle">CLAHE + blur</text>
    <!-- 4 -->
    <rect x="448" y="100" width="118" height="86" rx="12" fill="url(#stage)" stroke="#30363D"/>
    <text x="507" y="132" fill="#22C55E" font-size="12" font-weight="700" text-anchor="middle">4 · ROI</text>
    <text x="507" y="154" fill="#E6EDF3" font-size="13" font-weight="600" text-anchor="middle">Mask</text>
    <text x="507" y="172" fill="#8B949E" font-size="11" text-anchor="middle">trapezoid</text>
    <!-- 5 -->
    <rect x="584" y="100" width="118" height="86" rx="12" fill="url(#stage)" stroke="#30363D"/>
    <text x="643" y="132" fill="#22C55E" font-size="12" font-weight="700" text-anchor="middle">5 · HOUGH</text>
    <text x="643" y="154" fill="#E6EDF3" font-size="13" font-weight="600" text-anchor="middle">Segments</text>
    <text x="643" y="172" fill="#8B949E" font-size="11" text-anchor="middle">HoughLinesP</text>
    <!-- 6 -->
    <rect x="720" y="100" width="118" height="86" rx="12" fill="url(#stage)" stroke="#30363D"/>
    <text x="779" y="132" fill="#22C55E" font-size="12" font-weight="700" text-anchor="middle">6 · ESTIMATE</text>
    <text x="779" y="154" fill="#E6EDF3" font-size="13" font-weight="600" text-anchor="middle">Fit + smooth</text>
    <text x="779" y="172" fill="#8B949E" font-size="11" text-anchor="middle">median · buffer</text>
    <!-- 7 -->
    <rect x="856" y="100" width="118" height="86" rx="12" fill="url(#stage)" stroke="#1F6FEB"/>
    <text x="915" y="132" fill="#58A6FF" font-size="12" font-weight="700" text-anchor="middle">7 · RENDER</text>
    <text x="915" y="154" fill="#E6EDF3" font-size="13" font-weight="600" text-anchor="middle">Overlay</text>
    <text x="915" y="172" fill="#8B949E" font-size="11" text-anchor="middle">+ HUD</text>
  </g>

  <!-- arrows -->
  <g stroke="#22C55E" stroke-width="2">
    <line x1="158" y1="143" x2="174" y2="143" marker-end="url(#parr)"/>
    <line x1="294" y1="143" x2="310" y2="143" marker-end="url(#parr)"/>
    <line x1="430" y1="143" x2="446" y2="143" marker-end="url(#parr)"/>
    <line x1="566" y1="143" x2="582" y2="143" marker-end="url(#parr)"/>
    <line x1="702" y1="143" x2="718" y2="143" marker-end="url(#parr)"/>
    <line x1="838" y1="143" x2="854" y2="143" marker-end="url(#parr)"/>
  </g>

  <text x="40" y="228" fill="#8B949E" font-size="12">≈ 9.5 ms / frame on a mid-range CPU  ·  ~90–120 FPS of headroom</text>
</svg>
