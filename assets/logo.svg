<svg width="160" height="160" viewBox="0 0 160 160" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Real-Time Lane Detection logo">
  <defs>
    <linearGradient id="llane" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22C55E"/>
      <stop offset="1" stop-color="#10B981"/>
    </linearGradient>
  </defs>
  <rect x="4" y="4" width="152" height="152" rx="36" fill="#0D1117" stroke="#30363D" stroke-width="2"/>
  <!-- road -->
  <polygon points="80,40 92,40 132,132 28,132" fill="#161B22"/>
  <!-- lane region -->
  <polygon points="81,42 91,42 112,132 48,132" fill="#22C55E" fill-opacity="0.14"/>
  <!-- lane boundaries -->
  <polygon points="80,42 84,42 50,132 38,132" fill="url(#llane)"/>
  <polygon points="88,42 92,42 122,132 110,132" fill="url(#llane)"/>
  <!-- dashed centre -->
  <g fill="#F0B429">
    <polygon points="85,50 87,50 87,64 84,64"/>
    <polygon points="83,74 89,74 90,94 82,94"/>
    <polygon points="80,104 92,104 94,132 78,132"/>
  </g>
  <circle cx="80" cy="40" r="4" fill="#3B82F6"/>
</svg>
