<svg width="1280" height="400" viewBox="0 0 1280 400" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Real-Time Lane Detection banner">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0D1117"/>
      <stop offset="1" stop-color="#010409"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#161B22"/>
      <stop offset="1" stop-color="#0D1117"/>
    </linearGradient>
    <linearGradient id="lane" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22C55E"/>
      <stop offset="1" stop-color="#10B981"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="1" r="0.9">
      <stop offset="0" stop-color="#22C55E" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#22C55E" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
  </defs>

  <rect width="1280" height="400" fill="url(#bg)"/>

  <!-- perspective road -->
  <polygon points="640,150 720,150 1120,400 160,400" fill="url(#road)"/>
  <polygon points="640,150 720,150 1120,400 160,400" fill="url(#glow)"/>
  <!-- lane region fill -->
  <polygon points="655,155 705,155 900,400 380,400" fill="#22C55E" fill-opacity="0.12"/>
  <!-- lane lines -->
  <polygon points="653,155 659,155 385,400 355,400" fill="url(#lane)"/>
  <polygon points="701,155 707,155 925,400 895,400" fill="url(#lane)"/>
  <!-- dashed centre line -->
  <g fill="#F0B429" opacity="0.85">
    <polygon points="678,168 682,168 683,196 677,196"/>
    <polygon points="675,214 685,214 687,258 673,258"/>
    <polygon points="671,286 689,286 692,344 668,344"/>
    <polygon points="665,372 695,372 699,400 661,400"/>
  </g>
  <!-- horizon glow line -->
  <rect x="200" y="149" width="880" height="2" fill="#22C55E" opacity="0.35" filter="url(#soft)"/>

  <!-- scan dots -->
  <g fill="#3B82F6">
    <circle cx="430" cy="330" r="4"/><circle cx="850" cy="330" r="4"/>
    <circle cx="470" cy="250" r="3"/><circle cx="805" cy="250" r="3"/>
    <circle cx="505" cy="195" r="2.5"/><circle cx="762" cy="195" r="2.5"/>
  </g>

  <!-- title -->
  <text x="80" y="150" font-family="'Segoe UI',Inter,Arial,sans-serif" font-size="62" font-weight="800" fill="#E6EDF3">Real-Time Lane Detection</text>
  <text x="82" y="196" font-family="'Segoe UI',Inter,Arial,sans-serif" font-size="24" font-weight="500" fill="#8B949E">Classical computer vision · Canny + Hough · Temporal smoothing</text>

  <!-- badges -->
  <g font-family="'Segoe UI',Inter,Arial,sans-serif" font-size="16" font-weight="600">
    <rect x="82" y="228" width="112" height="34" rx="17" fill="#161B22" stroke="#30363D"/>
    <text x="138" y="250" fill="#22C55E" text-anchor="middle">90+ FPS</text>
    <rect x="204" y="228" width="118" height="34" rx="17" fill="#161B22" stroke="#30363D"/>
    <text x="263" y="250" fill="#58A6FF" text-anchor="middle">Python 3.10+</text>
    <rect x="332" y="228" width="104" height="34" rx="17" fill="#161B22" stroke="#30363D"/>
    <text x="384" y="250" fill="#E6EDF3" text-anchor="middle">OpenCV</text>
    <rect x="446" y="228" width="128" height="34" rx="17" fill="#161B22" stroke="#30363D"/>
    <text x="510" y="250" fill="#F0B429" text-anchor="middle">MIT Licensed</text>
  </g>
</svg>
