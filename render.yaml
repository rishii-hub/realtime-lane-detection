# Render blueprint — deploys the FastAPI backend serving the built frontend.
# Connect this repo at https://dashboard.render.com -> New -> Blueprint.
services:
  - type: web
    name: lanevision
    runtime: python
    plan: free
    buildCommand: pip install -r requirements-server.txt && cd frontend && npm install && npm run build
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/metrics
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
